<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>ZCode 交互实验室</title>
<style>body{font-family:sans-serif;max-width:720px;margin:24px auto}button{margin:6px;padding:8px 14px}code{background:#eee;padding:1px 4px}</style>
</head>
<body>
  <h2>ZCode 交互实验室</h2>
  <p>分别用双击 / 右键 / Ctrl+点击 / Shift+点击 操作下方按钮：</p>
  <button id="target">多功能按钮</button>
  <ul>
    <li>普通点击: <output id="plain">0</output></li>
    <li>双击计数: <output id="dbl">0</output></li>
    <li>右键计数: <output id="ctx">0</output></li>
    <li>Ctrl+点击: <output id="ctrl">0</output></li>
    <li>Shift+点击: <output id="shift">0</output></li>
  </ul>
  <h3>内嵌 iframe（local file）</h3>
  <iframe id="lab-frame" src="inner.html" style="width:420px;height:220px;border:2px solid #888"></iframe>
  <script>
    const $ = id => document.getElementById(id);
    $('target').addEventListener('click', () => $('plain').textContent = +$('plain').textContent + 1);
    $('target').addEventListener('dblclick', () => $('dbl').textContent = +$('dbl').textContent + 1);
    $('target').addEventListener('contextmenu', e => { e.preventDefault(); $('ctx').textContent = +$('ctx').textContent + 1; });
    $('target').addEventListener('click', e => {
      if (e.ctrlKey) $('ctrl').textContent = +$('ctrl').textContent + 1;
      if (e.shiftKey) $('shift').textContent = +$('shift').textContent + 1;
    });
  </script>
</body>
</html>
