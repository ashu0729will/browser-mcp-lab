<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    width: 300px;
    background: #fff;
    color: #0f172a;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 14px;
    border-bottom: 1px solid #e2e8f0;
  }
  header .logo {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  header .title { font-size: 13px; font-weight: 600; }
  header .ver { font-size: 10px; color: #94a3b8; }
  header .gh {
    margin-left: auto;
    font-size: 11px;
    color: #64748b;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  header .gh:hover { color: #0f172a; }
  header .spacer { flex: 1; }
  main { padding: 12px 14px; }
  .row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; flex: none; }
  .dot.on  { background: #16a34a; }
  .dot.off { background: #dc2626; }
  .dot.wait { background: #f59e0b; }
  #statusText { font-size: 13px; }
  label { font-size: 12px; color: #64748b; }
  .port-row { display: flex; gap: 6px; align-items: center; }
  input {
    width: 90px;
    padding: 5px 8px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    font-size: 13px;
    outline: none;
  }
  input:focus { border-color: #16a34a; }
  button {
    padding: 5px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    color: #0f172a;
  }
  button:hover { background: #f1f5f9; }
  .actions { display: flex; gap: 8px; margin-top: 2px; }
  .actions button { flex: 1; padding: 7px 0; font-size: 13px; }
  .btn-connect { background: #16a34a; border-color: #16a34a; color: #fff; }
  .btn-connect:hover { background: #15803d; }
</style>
</head>
<body>
  <header>
    <span class="logo">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M4 1.5 L19.5 12 L12.2 13.4 L15.6 20.8 L12.6 22.1 L9.4 14.7 L4 19 Z" fill="#0f172a"/></svg>
    </span>
    <span class="title">Browser Session MCP</span>
    <span class="spacer"></span>
    <a class="gh" id="ghLink" href="https://github.com/ashu0729will/browser-mcp-lab" target="_blank" rel="noreferrer" title="GitHub 仓库">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c.51-.37 1.08-.82 2.04-.82.3 0 .64.04.95.11.28-.61 1.04-1.13 1.04-1.13s.58.13 1.04.82c.37.16.75.42 1.23.82.51.37.86.94.86 1.7 0 .99-.01 1.69-.02 1.92.13.24.42.52.42.52s-.15.24-.15.24c-.13.24-.42.52-.42.52s.15.24.15.24c.13.24.42.52.42.52s.15.24.15.24c.13.24.42.52.42.52s.15.24.15.24c.13.24.42.52.42.52s.15.24.15.24"/></svg>
      GitHub
    </a>
    <span class="ver" id="version"></span>
  </header>
  <main>
    <div class="row">
      <span class="dot" id="dot"></span>
      <span id="statusText">检查中…</span>
    </div>
    <div class="row">
      <label for="port">端口</label>
      <div class="port-row">
        <input id="port" type="number" value="9777" />
        <button id="save">保存</button>
      </div>
    </div>
    <div class="actions">
      <button id="connect" class="btn-connect">连接</button>
      <button id="disconnect">断开</button>
    </div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
